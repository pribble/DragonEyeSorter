# YOLOv8n-cls with ReLU instead of SiLU (ultralytics yolov8-cls.yaml + activation). Experiment 2026-10-11: integer
# ReLU is exact on the NPU, SiLU is approximated -> smaller NPU-vs-PC deviation? (train/README.md)
nc: 8
activation: nn.ReLU()
scales:
  n: [0.33, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
head:
  - [-1, 1, Classify, [nc]] # Classify
